<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 背景光晕 */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 25% 35%, rgba(255, 120, 180, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 65%, rgba(130, 80, 220, 0.25) 0%, transparent 45%),
                radial-gradient(ellipse at 60% 85%, rgba(90, 40, 160, 0.2) 0%, transparent 40%);
            pointer-events: none;
        }
        
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        
        /* 液态玻璃数字 */
        .digit {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 
                         'Helvetica Neue', sans-serif;
            font-size: 130px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -4px;
            
            position: relative;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            
            /* 玻璃主体渐变 - 模拟玻璃折射的彩色 */
            background-image: linear-gradient(
                165deg,
                #ffd6e8 0%,
                #ffb3d4 12%,
                #ff7eb3 28%,
                #e056a0 44%,
                #b066cc 62%,
                #8855dd 78%,
                #6366f1 92%,
                #818cf8 100%
            );
            
            /* 玻璃光泽 - 内部高光 */
            -webkit-mask-image: linear-gradient(
                170deg,
                rgba(255,255,255,1) 0%,
                rgba(255,255,255,0.95) 20%,
                rgba(255,255,255,0.9) 40%,
                rgba(255,255,255,0.95) 55%,
                rgba(255,255,255,0.92) 70%,
                rgba(255,255,255,0.98) 85%,
                rgba(255,255,255,1) 100%
            );
            mask-image: linear-gradient(
                170deg,
                rgba(255,255,255,1) 0%,
                rgba(255,255,255,0.95) 20%,
                rgba(255,255,255,0.9) 40%,
                rgba(255,255,255,0.95) 55%,
                rgba(255,255,255,0.92) 70%,
                rgba(255,255,255,0.98) 85%,
                rgba(255,255,255,1) 100%
            );
            
            /* 外发光 - 玻璃边缘光 */
            filter: drop-shadow(0 2px 16px rgba(255, 126, 179, 0.5))
                    drop-shadow(0 4px 32px rgba(178, 79, 179, 0.35))
                    drop-shadow(0 8px 48px rgba(99, 102, 241, 0.25));
        }
        
        /* 玻璃高光叠加层 - 左上角反光 */
        .digit::after {
            content: attr(data-char);
            position: absolute;
            left: 0;
            top: 0;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            letter-spacing: inherit;
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            background-image: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.75) 0%,
                rgba(255, 255, 255, 0.35) 18%,
                rgba(255, 255, 255, 0.08) 38%,
                rgba(255, 255, 255, 0) 52%,
                rgba(255, 255, 255, 0) 65%,
                rgba(255, 255, 255, 0.15) 82%,
                rgba(255, 255, 255, 0.4) 100%
            );
            pointer-events: none;
        }
        
        .colon {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 72px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.28);
            margin: 0 2px;
            line-height: 1;
            animation: blink 2s ease-in-out infinite;
            align-self: center;
            filter: blur(0.5px);
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: landscape) {
            .digit {
                font-size: 200px;
                letter-spacing: -6px;
            }
            .colon {
                font-size: 110px;
            }
        }
        
        /* 小屏横屏 */
        @media screen and (orientation: landscape) and (max-height: 400px) {
            .digit {
                font-size: 140px;
                letter-spacing: -4px;
            }
            .colon {
                font-size: 80px;
            }
        }
        
        /* 竖屏手机 */
        @media screen and (orientation: portrait) and (max-width: 400px) {
            .digit {
                font-size: 90px;
                letter-spacing: -3px;
            }
            .colon {
                font-size: 56px;
            }
        }
        
        /* 防止选中 */
        .digit, .colon {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg-glow"></div>
    
    <div class="clock-container">
        <span class="digit" id="h1" data-char="0">0</span>
        <span class="digit" id="h2" data-char="0">0</span>
        <span class="colon">:</span>
        <span class="digit" id="m1" data-char="0">0</span>
        <span class="digit" id="m2" data-char="0">0</span>
    </div>
    
    <script>
        const h1 = document.getElementById('h1');
        const h2 = document.getElementById('h2');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');
        
        function updateClock() {
            const now = new Date();
            
            // 时间 - 24小时制
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            if (h1.textContent !== hours[0]) {
                h1.textContent = hours[0];
                h1.setAttribute('data-char', hours[0]);
            }
            if (h2.textContent !== hours[1]) {
                h2.textContent = hours[1];
                h2.setAttribute('data-char', hours[1]);
            }
            if (m1.textContent !== minutes[0]) {
                m1.textContent = minutes[0];
                m1.setAttribute('data-char', minutes[0]);
            }
            if (m2.textContent !== minutes[1]) {
                m2.textContent = minutes[1];
                m2.setAttribute('data-char', minutes[1]);
            }
        }
        
        // 立即更新
        updateClock();
        
        // 每秒更新
        setInterval(updateClock, 1000);
        
        // 防止屏幕休眠（如果支持）
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('无法保持屏幕常亮');
                }
            }
            
            requestWakeLock();
            
            // 页面可见时重新请求
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }
    </script>
</body>
</html>
