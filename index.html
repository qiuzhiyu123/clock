<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 背景渐变光晕 */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 120%;
            height: 120%;
            background: 
                radial-gradient(ellipse at 30% 40%, rgba(255, 105, 180, 0.25) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 60%, rgba(138, 43, 226, 0.2) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(75, 0, 130, 0.15) 0%, transparent 45%);
            animation: bgShift 10s ease-in-out infinite alternate;
            pointer-events: none;
        }
        
        @keyframes bgShift {
            0% { transform: translate(-50%, -50%) rotate(0deg); opacity: 1; }
            33% { transform: translate(-48%, -52%) rotate(1deg); }
            66% { transform: translate(-52%, -48%) rotate(-1deg); }
            100% { transform: translate(-50%, -50%) rotate(0deg); opacity: 0.9; }
        }
        
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        
        .digit-wrapper {
            position: relative;
            display: inline-block;
        }
        
        /* 液态玻璃效果 - 数字本体 */
        .digit {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 
                         'Helvetica Neue', sans-serif;
            font-size: 130px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -4px;
            
            /* 玻璃质感：多层渐变模拟折射 */
            background: linear-gradient(
                165deg,
                rgba(255, 200, 230, 0.95) 0%,
                rgba(255, 126, 179, 0.9) 15%,
                rgba(224, 86, 160, 0.85) 35%,
                rgba(178, 79, 179, 0.9) 55%,
                rgba(123, 104, 238, 0.85) 75%,
                rgba(99, 102, 241, 0.95) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            
            /* 高光层 - 模拟玻璃反光 */
            position: relative;
        }
        
        /* 玻璃高光叠加层 */
        .digit::before {
            content: attr(data-char);
            position: absolute;
            left: 0;
            top: 0;
            font-size: inherit;
            font-weight: inherit;
            line-height: inherit;
            letter-spacing: inherit;
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.7) 0%,
                rgba(255, 255, 255, 0.15) 30%,
                rgba(255, 255, 255, 0) 50%,
                rgba(255, 255, 255, 0.08) 70%,
                rgba(255, 255, 255, 0.3) 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            pointer-events: none;
        }
        
        /* 液态微动效果 */
        .digit {
            animation: glassFlow 5s ease-in-out infinite;
            transform-origin: bottom center;
        }
        
        .digit:nth-child(1) { animation-delay: 0s; }
        .digit:nth-child(2) { animation-delay: 0.2s; }
        .digit:nth-child(4) { animation-delay: 0.4s; }
        .digit:nth-child(5) { animation-delay: 0.6s; }
        
        @keyframes glassFlow {
            0%, 100% { 
                filter: drop-shadow(0 0 20px rgba(255, 105, 180, 0.3)) drop-shadow(0 0 40px rgba(138, 43, 226, 0.2));
                transform: scaleY(1) scaleX(1);
            }
            25% { 
                filter: drop-shadow(0 0 25px rgba(255, 126, 179, 0.35)) drop-shadow(0 0 45px rgba(178, 79, 179, 0.22));
                transform: scaleY(1.02) scaleX(0.99);
            }
            50% { 
                filter: drop-shadow(0 0 18px rgba(178, 79, 179, 0.28)) drop-shadow(0 0 38px rgba(99, 102, 241, 0.18));
                transform: scaleY(0.98) scaleX(1.01);
            }
            75% { 
                filter: drop-shadow(0 0 22px rgba(123, 104, 238, 0.32)) drop-shadow(0 0 42px rgba(255, 105, 180, 0.2));
                transform: scaleY(1.01) scaleX(0.995);
            }
        }
        
        .colon {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 75px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.3);
            margin: 0 2px;
            line-height: 1;
            animation: blink 2s ease-in-out infinite, colonFloat 5s ease-in-out infinite;
            align-self: center;
            filter: blur(0.3px);
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        
        @keyframes colonFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-4px); }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: landscape) {
            .digit {
                font-size: 200px;
                letter-spacing: -6px;
            }
            .colon {
                font-size: 115px;
            }
        }
        
        /* 小屏横屏 */
        @media screen and (orientation: landscape) and (max-height: 400px) {
            .digit {
                font-size: 140px;
                letter-spacing: -4px;
            }
            .colon {
                font-size: 82px;
            }
        }
        
        /* 竖屏手机 */
        @media screen and (orientation: portrait) and (max-width: 400px) {
            .digit {
                font-size: 90px;
                letter-spacing: -3px;
            }
            .colon {
                font-size: 58px;
            }
        }
        
        /* 防止选中 */
        .digit, .colon {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg-glow"></div>
    
    <div class="clock-container">
        <span class="digit" id="h1" data-char="0">0</span>
        <span class="digit" id="h2" data-char="0">0</span>
        <span class="colon">:</span>
        <span class="digit" id="m1" data-char="0">0</span>
        <span class="digit" id="m2" data-char="0">0</span>
    </div>
    
    <script>
        const h1 = document.getElementById('h1');
        const h2 = document.getElementById('h2');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');
        
        function updateClock() {
            const now = new Date();
            
            // 时间 - 24小时制
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            // 更新文字和高光层
            if (h1.textContent !== hours[0]) {
                h1.textContent = hours[0];
                h1.setAttribute('data-char', hours[0]);
            }
            if (h2.textContent !== hours[1]) {
                h2.textContent = hours[1];
                h2.setAttribute('data-char', hours[1]);
            }
            if (m1.textContent !== minutes[0]) {
                m1.textContent = minutes[0];
                m1.setAttribute('data-char', minutes[0]);
            }
            if (m2.textContent !== minutes[1]) {
                m2.textContent = minutes[1];
                m2.setAttribute('data-char', minutes[1]);
            }
        }
        
        // 立即更新
        updateClock();
        
        // 每秒更新
        setInterval(updateClock, 1000);
        
        // 防止屏幕休眠（如果支持）
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('无法保持屏幕常亮');
                }
            }
            
            requestWakeLock();
            
            // 页面可见时重新请求
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }
    </script>
</body>
</html>
