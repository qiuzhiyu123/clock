<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <title>时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 背景光晕 */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 25% 35%, rgba(255, 120, 180, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 65%, rgba(130, 80, 220, 0.25) 0%, transparent 45%);
            pointer-events: none;
        }
        
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 1;
        }

        /* 横屏时改为左右布局 */
        @media screen and (orientation: landscape) {
            .main-container {
                flex-direction: row;
                gap: 40px;
                align-items: center;
            }
        }
        
        /* 左侧信息区（日期+天气） */
        .info-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }
        
        .date-text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 22px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.55);
            letter-spacing: 1px;
        }
        
        .weather-row {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .weather-icon {
            font-size: 24px;
            line-height: 1;
        }
        
        .weather-text {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 20px;
            font-weight: 400;
            color: rgba(255, 255, 255, 0.5);
        }
        
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        
        /* 立体玻璃数字 */
        .digit {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 
                         'Helvetica Neue', sans-serif;
            font-size: 110px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -3px;
            
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            
            background-image: linear-gradient(
                165deg,
                #ffe4f0 0%,
                #ffc8e0 10%,
                #ff9cc5 22%,
                #ff7eb3 36%,
                #dd66b3 52%,
                #b066cc 68%,
                #8855dd 82%,
                #6366f1 94%,
                #818cf8 100%
            );
            
            filter: drop-shadow(0 2px 3px rgba(255, 126, 179, 0.45))
                    drop-shadow(0 4px 8px rgba(200, 80, 160, 0.25))
                    drop-shadow(0 8px 16px rgba(150, 70, 190, 0.15));
            
            display: inline-block;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        
        /* 翻页动画 */
        .digit.flip-out {
            animation: flipOut 0.35s ease-in forwards;
        }
        
        .digit.flip-in {
            animation: flipIn 0.35s ease-out forwards;
        }
        
        @keyframes flipOut {
            0% { transform: rotateX(0deg) scale(1); opacity: 1; }
            100% { transform: rotateX(-90deg) scale(0.9); opacity: 0; }
        }
        
        @keyframes flipIn {
            0% { transform: rotateX(90deg) scale(0.9); opacity: 0; }
            100% { transform: rotateX(0deg) scale(1); opacity: 1; }
        }
        
        .colon {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 60px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.28);
            margin: 0 2px;
            line-height: 1;
            animation: blink 2s ease-in-out infinite;
            filter: blur(0.5px);
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: landscape) {
            .digit {
                font-size: 170px;
                letter-spacing: -5px;
            }
            .colon {
                font-size: 95px;
            }
            .date-text {
                font-size: 24px;
            }
            .weather-icon {
                font-size: 28px;
            }
            .weather-text {
                font-size: 22px;
            }
        }
        
        /* 小屏横屏 */
        @media screen and (orientation: landscape) and (max-height: 400px) {
            .digit {
                font-size: 120px;
                letter-spacing: -3px;
            }
            .colon {
                font-size: 68px;
            }
            .date-text {
                font-size: 18px;
            }
            .weather-icon {
                font-size: 22px;
            }
            .weather-text {
                font-size: 18px;
            }
            .info-panel {
                gap: 8px;
            }
        }
        
        /* 竖屏手机 */
        @media screen and (orientation: portrait) and (max-width: 400px) {
            .digit {
                font-size: 80px;
                letter-spacing: -2px;
            }
            .colon {
                font-size: 48px;
            }
            .date-text {
                font-size: 18px;
            }
            .weather-icon {
                font-size: 20px;
            }
            .weather-text {
                font-size: 17px;
            }
        }
        
        /* 防止选中 */
        .digit, .colon, .date-text, .weather-text {
            user-select: none;
            -webkit-user-select: none;
        }

        /* 全屏提示 */
        .fullscreen-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            font-family: -apple-system, sans-serif;
            pointer-events: none;
            opacity: 1;
            transition: opacity 2s ease;
            z-index: 10;
        }
        
        .fullscreen-hint.hidden {
            opacity: 0;
        }
    </style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg-glow"></div>
    
    <!-- 全屏提示 -->
    <div class="fullscreen-hint" id="hint">横屏已自动全屏</div>
    
    <div class="main-container">
        <!-- 左侧/上方 信息面板 -->
        <div class="info-panel">
            <div class="date-text" id="date"></div>
            <div class="weather-row">
                <span class="weather-icon" id="weatherIcon">🌤️</span>
                <span class="weather-text" id="weatherText">获取中...</span>
            </div>
        </div>
        
        <!-- 时钟 -->
        <div class="clock-container">
            <span class="digit" id="h1"></span>
            <span class="digit" id="h2"></span>
            <span class="colon">:</span>
            <span class="digit" id="m1"></span>
            <span class="digit" id="m2"></span>
        </div>
    </div>
    
    <script>
        const digits = [
            document.getElementById('h1'),
            document.getElementById('h2'),
            document.getElementById('m1'),
            document.getElementById('m2')
        ];
        const dateEl = document.getElementById('date');
        const weatherIconEl = document.getElementById('weatherIcon');
        const weatherTextEl = document.getElementById('weatherText');
        const hint = document.getElementById('hint');
        
        // ===== 立即初始化时间（页面一打开就是正确时间） =====
        function initTime() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const y = now.getFullYear();
            const m = now.getMonth() + 1;
            const d = now.getDate();
            
            // 直接写入，不触发动画
            digits[0].textContent = hours[0];
            digits[1].textContent = hours[1];
            digits[2].textContent = minutes[0];
            digits[3].textContent = minutes[1];
            dateEl.textContent = `${y}-${m}-${d}`;
        }
        
        // 在 DOM 解析后立即执行，不等 load 事件
        initTime();
        
        // ===== 全屏逻辑 =====
        let isFullscreen = false;
        
        async function enterFullscreen() {
            try {
                if (document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    await document.documentElement.webkitRequestFullscreen();
                } else if (document.documentElement.msRequestFullscreen) {
                    await document.documentElement.msRequestFullscreen();
                }
                isFullscreen = true;
                hint.classList.remove('hidden');
                setTimeout(() => hint.classList.add('hidden'), 3000);
            } catch (e) {}
        }
        
        function exitFullscreen() {
            if (document.exitFullscreen) {
                document.exitFullscreen();
            } else if (document.webkitExitFullscreen) {
                document.webkitExitFullscreen();
            } else if (document.msExitFullscreen) {
                document.msExitFullscreen();
            }
            isFullscreen = false;
        }
        
        function checkOrientation() {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape && !isFullscreen) {
                enterFullscreen();
            } else if (!isLandscape && isFullscreen) {
                exitFullscreen();
            }
        }
        
        window.addEventListener('resize', checkOrientation);
        window.addEventListener('orientationchange', () => {
            setTimeout(checkOrientation, 300);
        });
        
        window.addEventListener('load', () => {
            setTimeout(checkOrientation, 500);
        });
        
        document.addEventListener('fullscreenchange', () => {
            isFullscreen = !!document.fullscreenElement;
        });
        document.addEventListener('webkitfullscreenchange', () => {
            isFullscreen = !!document.webkitFullscreenElement;
        });
        
        document.body.addEventListener('click', () => {
            const isLandscape = window.innerWidth > window.innerHeight;
            if (isLandscape && !isFullscreen) {
                enterFullscreen();
            }
        });
        
        // ===== 天气获取 =====
        function fetchWeather() {
            if (!navigator.geolocation) {
                weatherIconEl.textContent = '🌡️';
                weatherTextEl.textContent = '无法定位';
                return;
            }
            
            navigator.geolocation.getCurrentPosition(
                async (pos) => {
                    const lat = pos.coords.latitude.toFixed(2);
                    const lon = pos.coords.longitude.toFixed(2);
                    
                    try {
                        const resp = await fetch(
                            `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,weather_code&timezone=auto`
                        );
                        const data = await resp.json();
                        
                        const temp = data.current.temperature_2m;
                        const code = data.current.weather_code;
                        
                        weatherTextEl.textContent = `${temp}°C`;
                        weatherIconEl.textContent = getWeatherEmoji(code);
                    } catch (e) {
                        weatherIconEl.textContent = '🌤️';
                        weatherTextEl.textContent = '获取失败';
                    }
                },
                (err) => {
                    weatherIconEl.textContent = '📍';
                    weatherTextEl.textContent = '定位被拒';
                },
                { timeout: 8000 }
            );
        }
        
        function getWeatherEmoji(code) {
            const map = {
                0: '☀️',   1: '🌤️',   2: '⛅',    3: '☁️',
                45: '🌫️',  48: '🌫️',
                51: '🌦️',  53: '🌧️',  55: '🌧️',
                61: '🌧️',  63: '🌧️',  65: '🌧️',
                66: '🌧️',  67: '🌨️',
                71: '🌨️',  73: '❄️',   75: '❄️',   77: '🌨️',
                80: '🌦️',  81: '🌧️',  82: '⛈️',
                85: '🌨️',  86: '❄️',
                95: '⛈️',  96: '⛈️',  99: '⛈️'
            };
            return map[code] || '🌤️';
        }
        
        // ===== 时钟逻辑（带翻页动画） =====
        function updateDigit(el, newVal) {
            if (el.textContent !== newVal) {
                el.classList.remove('flip-in');
                el.classList.add('flip-out');
                
                el.addEventListener('animationend', function handler() {
                    el.removeEventListener('animationend', handler);
                    el.textContent = newVal;
                    el.classList.remove('flip-out');
                    el.classList.add('flip-in');
                    
                    el.addEventListener('animationend', function handler2() {
                        el.removeEventListener('animationend', handler2);
                        el.classList.remove('flip-in');
                    });
                });
            }
        }
        
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            updateDigit(digits[0], hours[0]);
            updateDigit(digits[1], hours[1]);
            updateDigit(digits[2], minutes[0]);
            updateDigit(digits[3], minutes[1]);
        }
        
        function updateDate() {
            const now = new Date();
            const y = now.getFullYear();
            const m = now.getMonth() + 1;
            const d = now.getDate();
            dateEl.textContent = `${y}-${m}-${d}`;
        }
        
        // 每秒更新时钟
        setInterval(updateClock, 1000);
        
        // 每分钟更新日期
        setInterval(updateDate, 60000);
        
        // 获取天气，每30分钟刷新一次
        fetchWeather();
        setInterval(fetchWeather, 30 * 60 * 1000);
        
        // 防止屏幕休眠
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {}
            }
            
            requestWakeLock();
            
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }
    </script>
</body>
</html>
