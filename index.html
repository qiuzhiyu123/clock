<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .digit {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 
                         'Helvetica Neue', 'Arial', sans-serif;
            font-size: 120px;
            font-weight: 500;
            line-height: 1;
            background: linear-gradient(180deg, 
                #ffb8d0 0%, 
                #ff8fab 25%,
                #ff6b9d 50%,
                #c77dff 75%,
                #9d4edd 100%
            );
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -2px;
        }
        
        .colon {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 80px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.4);
            margin: 0 4px;
            line-height: 1;
            animation: blink 2s ease-in-out infinite;
            align-self: center;
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: landscape) {
            .digit {
                font-size: 180px;
                letter-spacing: -4px;
            }
            .colon {
                font-size: 120px;
            }
        }
        
        /* 小屏横屏 */
        @media screen and (orientation: landscape) and (max-height: 400px) {
            .digit {
                font-size: 120px;
                letter-spacing: -2px;
            }
            .colon {
                font-size: 80px;
            }
        }
        
        /* 竖屏手机 */
        @media screen and (orientation: portrait) and (max-width: 400px) {
            .digit {
                font-size: 80px;
            }
            .colon {
                font-size: 55px;
            }
        }
        
        /* 防止选中 */
        .digit, .colon {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <span class="digit" id="h1">0</span>
        <span class="digit" id="h2">0</span>
        <span class="colon">:</span>
        <span class="digit" id="m1">0</span>
        <span class="digit" id="m2">0</span>
    </div>
    
    <script>
        const h1 = document.getElementById('h1');
        const h2 = document.getElementById('h2');
        const m1 = document.getElementById('m1');
        const m2 = document.getElementById('m2');
        
        function updateClock() {
            const now = new Date();
            
            // 时间 - 24小时制
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            h1.textContent = hours[0];
            h2.textContent = hours[1];
            m1.textContent = minutes[0];
            m2.textContent = minutes[1];
        }
        
        // 立即更新
        updateClock();
        
        // 每秒更新
        setInterval(updateClock, 1000);
        
        // 防止屏幕休眠（如果支持）
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('无法保持屏幕常亮');
                }
            }
            
            requestWakeLock();
            
            // 页面可见时重新请求
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }
    </script>
</body>
</html>
