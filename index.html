<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>时钟</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }
        
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        
        /* 背景光晕 */
        .bg-glow {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 140%;
            height: 140%;
            background: 
                radial-gradient(ellipse at 25% 35%, rgba(255, 120, 180, 0.3) 0%, transparent 45%),
                radial-gradient(ellipse at 75% 65%, rgba(130, 80, 220, 0.25) 0%, transparent 45%);
            pointer-events: none;
        }
        
        .clock-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            position: relative;
            z-index: 1;
        }
        
        /* 立体玻璃数字 */
        .digit {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro', 
                         'Helvetica Neue', sans-serif;
            font-size: 130px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: -4px;
            
            color: transparent;
            background-clip: text;
            -webkit-background-clip: text;
            
            /* 彩色渐变主体 */
            background-image: linear-gradient(
                165deg,
                #ffe4f0 0%,
                #ffc8e0 10%,
                #ff9cc5 22%,
                #ff7eb3 36%,
                #dd66b3 52%,
                #b066cc 68%,
                #8855dd 82%,
                #6366f1 94%,
                #818cf8 100%
            );
            
            /* 减小泛光 */
            filter: drop-shadow(0 2px 3px rgba(255, 126, 179, 0.45))
                    drop-shadow(0 4px 8px rgba(200, 80, 160, 0.25))
                    drop-shadow(0 8px 16px rgba(150, 70, 190, 0.15));
            
            display: inline-block;
            transform-style: preserve-3d;
            backface-visibility: hidden;
        }
        
        /* 翻页动画 */
        .digit.flip-out {
            animation: flipOut 0.35s ease-in forwards;
        }
        
        .digit.flip-in {
            animation: flipIn 0.35s ease-out forwards;
        }
        
        @keyframes flipOut {
            0% { 
                transform: rotateX(0deg) scale(1); 
                opacity: 1; 
            }
            100% { 
                transform: rotateX(-90deg) scale(0.9); 
                opacity: 0; 
            }
        }
        
        @keyframes flipIn {
            0% { 
                transform: rotateX(90deg) scale(0.9); 
                opacity: 0; 
            }
            100% { 
                transform: rotateX(0deg) scale(1); 
                opacity: 1; 
            }
        }
        
        .colon {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif;
            font-size: 72px;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.28);
            margin: 0 2px;
            line-height: 1;
            animation: blink 2s ease-in-out infinite;
            filter: blur(0.5px);
        }
        
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.15; }
        }
        
        /* 横屏适配 */
        @media screen and (orientation: landscape) {
            .digit {
                font-size: 200px;
                letter-spacing: -6px;
            }
            .colon {
                font-size: 110px;
            }
        }
        
        /* 小屏横屏 */
        @media screen and (orientation: landscape) and (max-height: 400px) {
            .digit {
                font-size: 140px;
                letter-spacing: -4px;
            }
            .colon {
                font-size: 80px;
            }
        }
        
        /* 竖屏手机 */
        @media screen and (orientation: portrait) and (max-width: 400px) {
            .digit {
                font-size: 90px;
                letter-spacing: -3px;
            }
            .colon {
                font-size: 56px;
            }
        }
        
        /* 防止选中 */
        .digit, .colon {
            user-select: none;
            -webkit-user-select: none;
        }
    </style>
</head>
<body>
    <!-- 背景光晕 -->
    <div class="bg-glow"></div>
    
    <div class="clock-container">
        <span class="digit" id="h1">0</span>
        <span class="digit" id="h2">0</span>
        <span class="colon">:</span>
        <span class="digit" id="m1">0</span>
        <span class="digit" id="m2">0</span>
    </div>
    
    <script>
        const digits = [
            document.getElementById('h1'),
            document.getElementById('h2'),
            document.getElementById('m1'),
            document.getElementById('m2')
        ];
        
        function updateDigit(el, newVal) {
            if (el.textContent !== newVal) {
                // 翻出动画
                el.classList.remove('flip-in');
                el.classList.add('flip-out');
                
                el.addEventListener('animationend', function handler() {
                    el.removeEventListener('animationend', handler);
                    
                    // 更新值
                    el.textContent = newVal;
                    
                    // 翻入动画
                    el.classList.remove('flip-out');
                    el.classList.add('flip-in');
                    
                    el.addEventListener('animationend', function handler2() {
                        el.removeEventListener('animationend', handler2);
                        el.classList.remove('flip-in');
                    });
                });
            }
        }
        
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            updateDigit(digits[0], hours[0]);
            updateDigit(digits[1], hours[1]);
            updateDigit(digits[2], minutes[0]);
            updateDigit(digits[3], minutes[1]);
        }
        
        // 立即更新
        updateClock();
        
        // 每秒更新
        setInterval(updateClock, 1000);
        
        // 防止屏幕休眠（如果支持）
        if ('wakeLock' in navigator) {
            let wakeLock = null;
            
            async function requestWakeLock() {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                } catch (err) {
                    console.log('无法保持屏幕常亮');
                }
            }
            
            requestWakeLock();
            
            // 页面可见时重新请求
            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    requestWakeLock();
                }
            });
        }
    </script>
</body>
</html>
